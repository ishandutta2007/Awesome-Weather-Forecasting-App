<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="cloudGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".25"/><stop offset="100%" stop-color="#fff" stop-opacity=".05"/></linearGradient><linearGradient id="sunGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24" stop-opacity=".4"/><stop offset="100%" stop-color="#f59e0b" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatCloud{0%{transform:translateX(0)}50%{transform:translateX(25px)}}@keyframes waveMotion{0%{d:path(&quot;M 0 240 Q 300 200 600 240 T 1200 240 L 1200 320 L 0 320 Z&quot;)}50%{d:path(&quot;M 0 240 Q 300 270 600 230 T 1200 250 L 1200 320 L 0 320 Z&quot;)}}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:18px;fill:#38bdf8;letter-spacing:.5px}.tag{font-weight:600;font-size:13px;fill:#e0f2fe}.sun-bg{animation:pulseGlow 6s infinite ease-in-out;transform-origin:950px 100px}.cloud-bg{animation:floatCloud 12s infinite ease-in-out}.wave-line{animation:waveMotion 8s infinite ease-in-out}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g class="sun-bg"><circle cx="980" cy="90" r="140" fill="url(#sunGrad)"/><circle cx="980" cy="90" r="90" fill="#f59e0b" filter="url(#glow)" opacity=".15"/></g><path fill="#fff" d="M 0 240 Q 300 200 600 240 T 1200 240 L 1200 320 L 0 320 Z" class="wave-line" opacity=".04"/><path fill="#38bdf8" d="M 0 260 Q 300 290 600 250 T 1200 270 L 1200 320 L 0 320 Z" opacity=".07"/><g class="cloud-bg"><path fill="url(#cloudGrad)" d="M 820 180 A 45 45 0 0 1 900 150 A 65 65 0 0 1 1010 170 A 45 45 0 0 1 1050 210 L 810 210 A 35 35 0 0 1 820 180 Z"/></g><g transform="translate(800, 45)"><rect width="105" height="28" x="0" y="0" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2" rx="14"/><text x="52" y="18" class="tag" text-anchor="middle">⚡ Real-time</text></g><g transform="translate(918, 45)"><rect width="115" height="28" x="0" y="0" fill="#38bdf8" fill-opacity=".2" stroke="#38bdf8" stroke-opacity=".4" rx="14"/><text x="57" y="18" class="tag" text-anchor="middle">📡 Radar 3D</text></g><g transform="translate(1045, 45)"><rect width="105" height="28" x="0" y="0" fill="#34d399" fill-opacity=".2" stroke="#34d399" stroke-opacity=".4" rx="14"/><text x="52" y="18" class="tag" text-anchor="middle">🔒 Privacy 1st</text></g><g><g transform="translate(60, 0) translate(0, 75)"><rect width="68" height="68" x="0" y="0" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".25" rx="18"/><circle cx="46" cy="24" r="12" fill="#fbbf24"/><path fill="#fff" d="M 22 46 A 12 12 0 0 1 42 38 A 16 16 0 0 1 54 50 L 20 50 A 10 10 0 0 1 22 46 Z" opacity=".9"/></g><text x="90" y="112" class="title" transform="translate(60, 0)">Awesome Weather Forecasting App</text><text x="90" y="148" class="subtitle" transform="translate(60, 0)">Curated Ecosystem of SaaS Platforms, Open-Source Radar &amp; Weather Tools</text><g transform="translate(60, 0) translate(0, 195)"><line x1="0" x2="680" y1="0" y2="0" stroke="#fff" stroke-opacity=".15" stroke-width="1"/><text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">ACCURACY METRICS • NEXRAD LEVEL 2/3 • OPEN-METEO FOSS • WEATHER APIS &amp; SDKs</text></g></g></svg>