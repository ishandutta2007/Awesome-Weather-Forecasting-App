<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0f2fe;
    }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatCloud {
      0% { transform: translateX(0px); }
      50% { transform: translateX(25px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveMotion {
      0% { d: path("M 0 240 Q 300 200 600 240 T 1200 240 L 1200 320 L 0 320 Z"); }
      50% { d: path("M 0 240 Q 300 270 600 230 T 1200 250 L 1200 320 L 0 320 Z"); }
      100% { d: path("M 0 240 Q 300 200 600 240 T 1200 240 L 1200 320 L 0 320 Z"); }
    }

    .sun-bg {
      animation: pulseGlow 6s infinite ease-in-out;
      transform-origin: 950px 100px;
    }
    .cloud-bg {
      animation: floatCloud 12s infinite ease-in-out;
    }
    .wave-line {
      animation: waveMotion 8s infinite ease-in-out;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Dynamic Elements -->
  <g class="sun-bg">
    <circle cx="980" cy="90" r="140" fill="url(#sunGrad)" />
    <circle cx="980" cy="90" r="90" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Animated Background Wave Graphic -->
  <path class="wave-line" d="M 0 240 Q 300 200 600 240 T 1200 240 L 1200 320 L 0 320 Z" fill="#ffffff" opacity="0.04" />
  <path d="M 0 260 Q 300 290 600 250 T 1200 270 L 1200 320 L 0 320 Z" fill="#38bdf8" opacity="0.07" />

  <!-- Cloud Shapes in Background Right -->
  <g class="cloud-bg">
    <path d="M 820 180 A 45 45 0 0 1 900 150 A 65 65 0 0 1 1010 170 A 45 45 0 0 1 1050 210 L 810 210 A 35 35 0 0 1 820 180 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Decorative Pills / Tags (Top Right - Decorative) -->
  <g transform="translate(800, 45)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="52" y="18" text-anchor="middle" class="tag">⚡ Real-time</text>
  </g>
  <g transform="translate(918, 45)">
    <rect x="0" y="0" width="115" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="57" y="18" text-anchor="middle" class="tag">📡 Radar 3D</text>
  </g>
  <g transform="translate(1045, 45)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4" />
    <text x="52" y="18" text-anchor="middle" class="tag">🔒 Privacy 1st</text>
  </g>

  <!-- Foreground Content -->
  <g transform="translate(60, 0)">
    <!-- Weather Icon Graphic -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="68" height="68" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" />
      <circle cx="46" cy="24" r="12" fill="#fbbf24" />
      <path d="M 22 46 A 12 12 0 0 1 42 38 A 16 16 0 0 1 54 50 L 20 50 A 10 10 0 0 1 22 46 Z" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Main Title & Subtitle -->
    <text x="90" y="112" class="title">Awesome Weather Forecasting App</text>
    <text x="90" y="148" class="subtitle">Curated Ecosystem of SaaS Platforms, Open-Source Radar &amp; Weather Tools</text>

    <!-- Sub-features Bar -->
    <g transform="translate(0, 195)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="500">
        ACCURACY METRICS  •  NEXRAD LEVEL 2/3  •  OPEN-METEO FOSS  •  WEATHER APIS &amp; SDKs
      </text>
    </g>
  </g>
</svg>
